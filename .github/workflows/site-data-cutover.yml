# TEMPORARY, for the switch to the database as the master copy. Delete this file before the pull request
# merges.
#
# On a push to the switch-over branch: reads the Google Sheet's site tabs and catches the database up with
# them (a dry run unless the commit message contains [catch-up]), then exports the site's data files from
# the database and commits them to the branch, so the Vercel preview shows the site built from the database.
name: Site data cutover preview

on:
  push:
    branches: [claude/project-thread-uxdyhc]
    paths-ignore: ["src/data/**", "data/food-deals/deals.json"]

permissions:
  contents: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        env:
          SA: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          npm ci
          npm install --no-save pg
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          echo "GOOGLE_SERVICE_ACCOUNT=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"

      - name: Catch the database up with the Sheet
        env:
          REAL: ${{ contains(github.event.head_commit.message, '[catch-up]') }}
        run: |
          if [ "$REAL" = "true" ]; then node scripts/db/sheet-catch-up.mjs; else node scripts/db/sheet-catch-up.mjs --dry-run; fi

      - name: The same files from the Sheet, for comparison
        run: |
          mkdir -p "$RUNNER_TEMP/sheet"
          for f in restaurants activities hotels hidden-london events; do node scripts/export-$f.mjs --from-sheet > /dev/null; done
          cp src/data/restaurants.json src/data/activities.json src/data/hotels.json src/data/hiddenLondon.json src/data/events.json "$RUNNER_TEMP/sheet/"
          git checkout -- src/data

      - name: Export from the database
        run: |
          node scripts/export-restaurants.mjs
          node scripts/export-activities.mjs
          node scripts/export-hotels.mjs
          node scripts/export-hidden-london.mjs
          node scripts/export-events.mjs
          node scripts/db/export-deals.mjs
          node scripts/export-restaurant-map.mjs || echo "::warning::The map export reported problems; see the log above."

      - name: Differences between the Sheet's files and the database's
        run: |
          for f in restaurants activities hotels hiddenLondon events; do
            echo "== $f"
            diff <(jq -S 'del(.generated)' "$RUNNER_TEMP/sheet/$f.json") <(jq -S 'del(.generated)' "src/data/$f.json") | head -60 || true
          done

      - name: Commit the files to the branch
        run: |
          FILES="src/data data/food-deals/deals.json"
          CHANGED=$(git diff -U0 -- $FILES | grep -E '^[-+][^-+]' | grep -vE '^[-+]\s*"generated": ' | wc -l)
          if [ "$CHANGED" -eq 0 ]; then echo "The database gives the same files as main."; exit 0; fi
          git diff --stat -- $FILES
          git config user.name "site-data-bot"
          git config user.email "site-data-bot@users.noreply.github.com"
          git add $FILES
          git commit -m "Site data from the database (cutover preview)"
          git push origin HEAD:${{ github.ref_name }}
