# Builds the site's data files from the Supabase database, which is the master copy of places, events
# and deals, and opens a pull request when anything a reader would see has changed.
#
#   Every morning: the restaurants, map pins, activities, hotels, Hidden London, events and deals files are
#   exported from the database. If they changed (beyond the export date), the "Site data from the database"
#   pull request is opened or updated. Vercel builds a preview of it; merging it puts the change live.
#
# Needs the SUPABASE_DB_URL repository secret (see database.yml).
# Run it by hand from the Actions tab with "Run workflow".
name: Site data from the database

on:
  schedule:
    - cron: "30 4 * * *" # 04:30 UTC daily, before the morning
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: site-data
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.SUPABASE_DB_URL }}
      BRANCH: site-data/from-database
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Add the SUPABASE_DB_URL repository secret first."; exit 1; fi
          npm ci
          npm install --no-save pg

      - name: Export from the database
        run: |
          node scripts/export-restaurants.mjs
          node scripts/export-activities.mjs
          node scripts/export-hotels.mjs
          node scripts/export-hidden-london.mjs
          node scripts/export-events.mjs
          node scripts/db/export-deals.mjs

      # Prints pins it had to leave out and pins pointing at a missing heading; neither stops the export.
      - name: Map pins
        run: node scripts/export-restaurant-map.mjs || echo "::warning::The map export reported problems; see the log above."

      - name: Open or update the pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FILES="src/data data/food-deals/deals.json"
          # Only the export date changed: nothing to show.
          CHANGED=$(git diff -U0 -- $FILES | grep -E '^[-+][^-+]' | grep -vE '^[-+]\s*"generated": ' | wc -l)
          if [ "$CHANGED" -eq 0 ]; then echo "No change a reader would see."; exit 0; fi
          git diff --stat -- $FILES
          git config user.name "site-data-bot"
          git config user.email "site-data-bot@users.noreply.github.com"
          git checkout -B "$BRANCH"
          git add $FILES
          git commit -m "Site data from the database, $(date -u +%Y-%m-%d)"
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number')" ]; then
            gh pr create --head "$BRANCH" --base main --title "Site data from the database" --body "$(printf '%s\n\n%s\n\n%s' \
              'The day'"'"'s changes to places, events and deals in the database, exported to the files the site is built from. Check the Vercel preview, then merge to put them live.' \
              "$(git diff --stat HEAD~1 -- $FILES)" \
              'Generated by the "Site data from the database" workflow.')"
          fi
