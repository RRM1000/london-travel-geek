# Refreshes the What's On listings every morning.
#
# Reads every source (venue box offices, Ticketmaster, DICE), rewrites the
# Listings tabs in the Google Sheet, and commits src/data/listings.json. That
# commit lands on main, and the push to main deploys the site as usual.
#
# If a source fails and the listings shrink by more than 40%, export-site.mjs
# refuses to write, the job fails, and yesterday's listings stay up.
#
# Needs two repository secrets (Settings > Secrets and variables > Actions):
#   TICKETMASTER_API_KEY          the Consumer Key from developer.ticketmaster.com
#   GOOGLE_SERVICE_ACCOUNT_JSON   the whole service-account JSON file
#
# Run it by hand from the Actions tab with "Run workflow".
name: Refresh listings

on:
  schedule:
    - cron: "15 5 * * *" # 05:15 UTC: 06:15 in summer, 05:15 in winter
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: listings
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Service account
        env:
          SA: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          if [ -n "$SA" ]; then
            printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
            echo "GOOGLE_SERVICE_ACCOUNT=$RUNNER_TEMP/sa.json" >> "$GITHUB_ENV"
          fi

      - name: Read every source and export
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
        run: npm run listings

      - name: Commit the new listings
        run: |
          git config user.name "listings-bot"
          git config user.email "listings-bot@users.noreply.github.com"
          git add src/data/listings.json data/listings/platforms.json data/listings/long-runs.json
          if git diff --cached --quiet; then
            echo "No change in the listings."
            exit 0
          fi
          git commit -m "Listings: daily refresh $(date -u +%Y-%m-%d)"
          # Someone may have pushed while this ran; put the data commit on top.
          git pull --rebase origin main
          git push origin HEAD:main
