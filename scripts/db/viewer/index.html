<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LTG database</title>
<style>
  :root { --bg:#f6f5f2; --card:#fff; --ink:#1d1c1a; --muted:#6d6a64; --line:#e3e0da; --accent:#1f5f8b; --good:#2e7d4f; --bad:#a33a2c; --warn:#a86b00; --chip:#eef2f6; }
  @media (prefers-color-scheme: dark) { :root { --bg:#161615; --card:#1f1f1d; --ink:#ecebe8; --muted:#a29f98; --line:#33322f; --accent:#6fb2e0; --good:#6cc690; --bad:#ec8a7c; --warn:#e0b153; --chip:#2a2f35; } }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:14px/1.45 system-ui, "Segoe UI", sans-serif; }
  header { display:flex; align-items:center; gap:24px; padding:12px 20px; background:var(--card); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; margin:0; }
  nav button { background:none; border:0; padding:8px 12px; font:inherit; color:var(--muted); cursor:pointer; border-radius:6px; }
  nav button.on { color:var(--ink); background:var(--chip); font-weight:600; }
  main { padding:20px; max-width:1400px; margin:0 auto; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill, minmax(200px, 1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:14px 16px; }
  .big { font-size:26px; font-weight:650; font-variant-numeric:tabular-nums; }
  .muted { color:var(--muted); } .small { font-size:12px; }
  h2 { font-size:15px; margin:24px 0 10px; }
  table { width:100%; border-collapse:collapse; background:var(--card); border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  th, td { text-align:left; padding:7px 10px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { font-size:12px; color:var(--muted); font-weight:600; background:var(--bg); }
  td.num, th.num { text-align:right; font-variant-numeric:tabular-nums; }
  tr.click { cursor:pointer; } tr.click:hover td { background:var(--chip); }
  .bar { height:8px; background:var(--accent); border-radius:4px; min-width:2px; }
  .filters { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:12px; align-items:center; }
  input, select { font:inherit; padding:6px 8px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--ink); }
  input[type=search] { min-width:240px; }
  .chip { display:inline-block; padding:1px 8px; border-radius:10px; background:var(--chip); font-size:12px; margin:0 4px 2px 0; }
  .chip.rec { background:var(--good); color:#fff; }
  .pager { display:flex; gap:8px; align-items:center; margin:12px 0; }
  button.btn { font:inherit; padding:6px 12px; border-radius:6px; border:1px solid var(--line); background:var(--card); color:var(--ink); cursor:pointer; }
  button.btn:hover { border-color:var(--accent); }
  button.add { background:var(--good); border-color:var(--good); color:#fff; }
  button.dismiss { color:var(--bad); }
  .item { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:12px 16px; margin-bottom:10px; display:flex; gap:16px; }
  .item .body { flex:1; min-width:0; }
  .item .acts { display:flex; flex-direction:column; gap:6px; }
  .item h3 { margin:0 0 4px; font-size:15px; } .item h3 a { color:var(--ink); }
  .item p { margin:6px 0 0; color:var(--muted); overflow-wrap:anywhere; }
  .item.done { opacity:.45; }
  a { color:var(--accent); }
  #panel { position:fixed; top:0; right:0; bottom:0; width:min(640px, 100%); background:var(--card); border-left:1px solid var(--line); box-shadow:-8px 0 24px rgba(0,0,0,.12); overflow:auto; padding:20px; transform:translateX(100%); transition:transform .15s; z-index:10; }
  #panel.open { transform:none; }
  #panel .close { float:right; }
  dl { display:grid; grid-template-columns:140px 1fr; gap:4px 12px; margin:12px 0; }
  dt { color:var(--muted); } dd { margin:0; overflow-wrap:anywhere; }
  pre { background:var(--bg); padding:10px; border-radius:6px; overflow:auto; font-size:12px; max-height:300px; }
  .err { color:var(--bad); padding:12px; }
  .stale { color:var(--warn); }
</style>
</head>
<body>
<header>
  <h1>LTG database</h1>
  <nav>
    <button data-tab="dash" class="on">Dashboard</button>
    <button data-tab="places">Places</button>
    <button data-tab="deals">Deals</button>
    <button data-tab="sources">Sources</button>
    <button data-tab="articles">Articles</button>
    <button data-tab="queue">Content queue</button>
  </nav>
  <span class="muted small" id="stamp"></span>
</header>
<main>
  <section id="dash"></section>
  <section id="places" hidden>
    <div class="filters">
      <input type="search" id="pq" placeholder="Name, address or postcode">
      <select id="pcat"><option value="">Any type</option></select>
      <select id="pbor"><option value="">Any borough</option></select>
      <select id="prec"><option value="">Recommended or not</option><option value="yes">Recommended</option><option value="no">Not recommended</option></select>
      <select id="porig"><option value="">Any origin</option><option value="sheet">Our Sheet</option><option value="research">Research names</option><option value="fsa">Hygiene register (FSA)</option><option value="osm">OpenStreetMap</option><option value="other">Other</option></select>
      <select id="phyg"><option value="">Any hygiene rating</option><option>5</option><option>4</option><option>3</option><option>2</option><option>1</option><option>0</option><option value="AwaitingInspection">Awaiting inspection</option><option>Exempt</option><option value="none">No rating</option></select>
      <select id="pweb"><option value="">Website or not</option><option value="yes">Has website</option><option value="no">No website</option></select>
      <select id="pstat"><option value="">Any status</option><option value="open">Open</option><option value="closed">Closed</option><option value="temporarily_closed">Temporarily closed</option><option value="unknown">Unknown</option></select>
      <button class="btn" id="preset">Clear</button>
    </div>
    <div id="plist"></div>
  </section>
  <section id="deals" hidden>
    <div class="filters">
      <input type="search" id="dq" placeholder="Restaurant, offer or branch">
      <select id="dwhen"><option value="current">Running now</option><option value="expired">Ended</option><option value="later">Starting later</option><option value="all">All deals</option></select>
      <select id="dtype"><option value="">Any kind of deal</option></select>
      <select id="dcat"><option value="">Any type of place</option></select>
      <select id="dbor"><option value="">Any borough</option></select>
      <button class="btn" id="dreset">Clear</button>
    </div>
    <div id="dlist"></div>
  </section>
  <section id="sources" hidden>
    <div class="filters">
      <input type="search" id="sq" placeholder="Name, website or channel">
      <select id="skind"><option value="">Every kind</option><option value="youtube">YouTube creators</option><option value="tiktok">TikTok creators</option><option value="blog">Blogs</option><option value="publication">Publications and websites</option></select>
      <select id="stier"><option value="">Any tier</option><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option><option value="none">No tier</option></select>
      <select id="swatch"><option value="">Watched or not</option><option value="watched">Watched for new content</option><option value="no_feed">No feed to watch</option><option value="not_watched">Not watched</option><option value="dead">Channel or site gone</option><option value="excluded">Excluded</option></select>
      <select id="ssort"><option value="reviews">Most reviews first</option><option value="name">A to Z</option></select>
    </div>
    <div id="slist"></div>
  </section>
  <section id="articles" hidden>
    <div class="filters">
      <input type="search" id="aq" placeholder="Article title">
      <select id="acat"><option value="">Any section</option></select>
      <select id="adraft"><option value="">Published and drafts</option><option value="no">Published</option><option value="yes">Drafts</option></select>
      <select id="asort"><option value="title">A to Z</option><option value="places">Most places first</option><option value="updated">Recently updated first</option></select>
    </div>
    <div id="alist"></div>
  </section>
  <section id="queue" hidden>
    <div class="filters">
      <select id="qstat"><option value="new">Waiting for a decision</option><option value="added">Marked worth covering</option><option value="rejected">Dismissed</option></select>
      <select id="qtag"><option value="">Any tag</option><option>opening</option><option>closing</option><option>event</option><option>deal</option><option>award</option><option>review</option><option value="untagged">No tag</option></select>
      <select id="qmed"><option value="">Videos, Shorts and articles</option><option value="video">Videos</option><option value="short">Shorts</option><option value="article">Articles</option></select>
      <input type="search" id="qq" placeholder="Search titles and creators">
      <label class="small"><input type="checkbox" id="qplaces"> Names a place we know</label>
      <label class="small"><input type="checkbox" id="qall"> Include non-London and sponsored</label>
    </div>
    <div id="qlist"></div>
  </section>
</main>
<aside id="panel"></aside>
<script>
const $ = (s) => document.querySelector(s);
const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c]));
const fmt = (n) => (n ?? 0).toLocaleString("en-GB");
const day = (d) => d ? new Date(d).toLocaleDateString("en-GB", { day:"numeric", month:"short", year:"numeric" }) : "";
const safeUrl = (u) => /^https?:\/\//i.test(u || "") ? u : "";
const link = (u, t) => safeUrl(u) ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t ?? u)}</a>` : esc(t ?? "");
async function api(path, opts) {
  const r = await fetch(path, opts);
  const j = await r.json().catch(() => ({ error: "Bad response" }));
  if (!r.ok) throw new Error(j.error || r.statusText);
  return j;
}
const ORIGINS = { sheet:"Our Sheet", research:"Research names", fsa:"Hygiene register", osm:"OpenStreetMap", other:"Other" };
const TABLE_NAMES = { places:"Places", reviews:"Reviews and mentions", sources:"Sources", events:"Events", deals:"Deals", content_queue:"Content queue", tours:"Tours", market_traders:"Market traders", articles:"Articles on the site", article_places:"Places named in articles", sheet_extras:"Sheet work lists" };

// Tabs
document.querySelectorAll("nav button").forEach((b) => b.onclick = () => show(b.dataset.tab));
function show(tab) {
  document.querySelectorAll("nav button").forEach((b) => b.classList.toggle("on", b.dataset.tab === tab));
  for (const id of TABS) $("#" + id).hidden = id !== tab;
  try { localStorage.setItem("tab", tab); } catch {}
  if (tab === "dash") loadDash();
  if (tab === "places") loadPlaces();
  if (tab === "deals") loadDeals();
  if (tab === "sources") loadSources();
  if (tab === "articles") loadArticles();
  if (tab === "queue") loadQueue();
}
const TABS = ["dash", "places", "deals", "sources", "articles", "queue"];

// Dashboard
async function loadDash() {
  const el = $("#dash");
  try {
    const s = await api("/api/summary");
    $("#stamp").textContent = "Read " + new Date(s.at).toLocaleTimeString("en-GB");
    const newQ = s.queue.find((r) => r.status === "new");
    const maxCat = Math.max(...s.byCategory.map((r) => r.n));
    const maxOrig = Math.max(...s.byOrigin.map((r) => r.n));
    el.innerHTML = `
      <div class="grid">
        <div class="card"><div class="muted small">Places (without duplicates)</div><div class="big">${fmt(s.placesBrowse.n)}</div></div>
        <div class="card"><div class="muted small">Recommended on the site</div><div class="big">${fmt(s.placesBrowse.recommended)}</div></div>
        <div class="card"><div class="muted small">Places with a website</div><div class="big">${fmt(s.placesBrowse.with_website)}</div></div>
        <div class="card"><div class="muted small">Queue items waiting (London, not sponsored)</div><div class="big">${fmt(newQ?.shown)}</div></div>
      </div>
      <h2>Tables and how fresh they are</h2>
      <table><tr><th>Table</th><th class="num">Rows</th><th>Last checked, newest</th><th>Oldest</th><th class="num">Never checked</th><th class="num">Over 30 days old</th></tr>
      ${s.tables.map((t) => t.missing ? `<tr><td>${esc(TABLE_NAMES[t.table] || t.table)}</td><td colspan="5" class="muted">Not loaded yet</td></tr>` : t.error ? `<tr><td>${esc(TABLE_NAMES[t.table] || t.table)}</td><td colspan="5" class="err">${esc(t.error)}</td></tr>` : `
        <tr><td>${esc(TABLE_NAMES[t.table] || t.table)}</td><td class="num">${fmt(t.n)}</td><td>${day(t.newest)}</td><td>${day(t.oldest)}</td>
        <td class="num">${t.never === undefined ? "" : fmt(t.never)}</td><td class="num ${t.stale ? "stale" : ""}">${t.stale === undefined ? "" : fmt(t.stale)}</td></tr>`).join("")}
      </table>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(380px,1fr));gap:20px">
        <div><h2>Places by type</h2>
          <table><tr><th>Type</th><th class="num">Places</th><th class="num">Recommended</th><th style="width:35%"></th></tr>
          ${s.byCategory.map((r) => `<tr class="click" data-cat="${esc(r.category)}"><td>${esc(r.category)}</td><td class="num">${fmt(r.n)}</td><td class="num">${fmt(r.recommended)}</td><td><div class="bar" style="width:${(r.n / maxCat * 100).toFixed(1)}%"></div></td></tr>`).join("")}
          </table></div>
        <div><h2>Places by where they came from</h2>
          <table><tr><th>Origin</th><th class="num">Places</th><th style="width:45%"></th></tr>
          ${s.byOrigin.map((r) => `<tr class="click" data-orig="${esc(r.origin)}"><td>${esc(ORIGINS[r.origin] || r.origin)}</td><td class="num">${fmt(r.n)}</td><td><div class="bar" style="width:${(r.n / maxOrig * 100).toFixed(1)}%"></div></td></tr>`).join("")}
          </table>
          <h2>Content queue</h2>
          <table><tr><th>Status</th><th class="num">All</th><th class="num">London, not sponsored</th></tr>
          ${s.queue.map((r) => `<tr><td>${{ new:"Waiting", added:"Worth covering", rejected:"Dismissed" }[r.status] || esc(r.status)}</td><td class="num">${fmt(r.n)}</td><td class="num">${fmt(r.shown)}</td></tr>`).join("")}
          </table>
          <p class="small muted">Waiting items by tag: ${s.queueTags.map((t) => `<span class="chip">${esc(t.tag)} ${fmt(t.n)}</span>`).join("") || "none"}</p>
          <p class="small muted">Found per day, last two weeks: ${s.recent.map((r) => `<span class="chip">${day(r.d).replace(/ \d{4}$/, "")}: ${fmt(r.n)}</span>`).join("") || "none"}</p>
        </div>
      </div>`;
    el.querySelectorAll("tr[data-cat]").forEach((tr) => tr.onclick = () => { resetPlaces(); $("#pcat").value = tr.dataset.cat; show("places"); });
    el.querySelectorAll("tr[data-orig]").forEach((tr) => tr.onclick = () => { resetPlaces(); $("#porig").value = tr.dataset.orig; show("places"); });
  } catch (e) { el.innerHTML = `<div class="err">Could not read the database: ${esc(e.message)}</div>`; }
}

// Places
let pPage = 0, optsLoaded = false, timer;
const pIds = ["pq", "pcat", "pbor", "prec", "porig", "phyg", "pweb", "pstat"];
pIds.forEach((id) => $("#" + id).addEventListener(id === "pq" ? "input" : "change", () => { pPage = 0; clearTimeout(timer); timer = setTimeout(loadPlaces, id === "pq" ? 300 : 0); }));
$("#preset").onclick = () => { resetPlaces(); loadPlaces(); };
function resetPlaces() { pIds.forEach((id) => $("#" + id).value = ""); pPage = 0; }
async function loadPlaces() {
  if (!optsLoaded) {
    try {
      const o = await api("/api/options");
      const keepCat = $("#pcat").value, keepBor = $("#pbor").value;
      $("#pcat").innerHTML = `<option value="">Any type</option>` + o.categories.map((c) => `<option value="${esc(c.category)}">${esc(c.category)} (${fmt(c.n)})</option>`).join("");
      $("#pbor").innerHTML = `<option value="">Any borough</option>` + o.boroughs.map((b) => `<option value="${esc(b.borough)}">${esc(b.borough)} (${fmt(b.n)})</option>`).join("");
      $("#pcat").value = keepCat; $("#pbor").value = keepBor;
      optsLoaded = true;
    } catch {}
  }
  const p = new URLSearchParams({ q:$("#pq").value.trim(), category:$("#pcat").value, borough:$("#pbor").value, recommended:$("#prec").value,
    origin:$("#porig").value, hygiene:$("#phyg").value, website:$("#pweb").value, status:$("#pstat").value, page:pPage });
  const el = $("#plist");
  try {
    const r = await api("/api/places?" + p);
    el.innerHTML = `<div class="pager"><span>${fmt(r.total)} places</span>${pager(r.total, 100, r.page)}</div>
      <table><tr><th>Name</th><th>Type</th><th>Area</th><th>Postcode</th><th>Hygiene</th><th>Origin</th><th>Last checked</th><th>Website</th></tr>
      ${r.rows.map((x) => `<tr class="click" data-id="${x.id}">
        <td>${x.recommended ? '<span class="chip rec">recommended</span>' : ""}${esc(x.name)}${x.status !== "open" ? ` <span class="chip">${esc(x.status)}</span>` : ""}</td>
        <td>${esc(x.category)}${x.subcategory ? `<div class="small muted">${esc(x.subcategory)}</div>` : ""}</td>
        <td>${esc(x.area || "")}${x.borough ? `<div class="small muted">${esc(x.borough)}</div>` : ""}</td>
        <td>${esc(x.postcode)}</td><td>${esc(x.hygiene)}</td><td>${esc(ORIGINS[x.origin_group])}</td><td>${day(x.last_checked)}</td>
        <td class="small">${safeUrl(x.website) ? link(x.website, new URL(x.website).hostname.replace(/^www\./, "")) : ""}</td></tr>`).join("")}
      </table><div class="pager">${pager(r.total, 100, r.page)}</div>`;
    el.querySelectorAll("tr[data-id]").forEach((tr) => tr.onclick = (ev) => { if (ev.target.tagName !== "A") openPlace(tr.dataset.id); });
    el.querySelectorAll("[data-page]").forEach((b) => b.onclick = () => { pPage = Number(b.dataset.page); loadPlaces(); scrollTo(0, 0); });
  } catch (e) { el.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
function pager(total, per, page) {
  const last = Math.max(0, Math.ceil(total / per) - 1);
  if (!last) return "";
  return `<button class="btn" data-page="${page - 1}" ${page ? "" : "disabled"}>Previous</button>
    <span class="muted">Page ${page + 1} of ${fmt(last + 1)}</span>
    <button class="btn" data-page="${page + 1}" ${page < last ? "" : "disabled"}>Next</button>`;
}

async function openPlace(id) {
  const el = $("#panel");
  el.innerHTML = "Loading…"; el.classList.add("open");
  try {
    const d = await api("/api/places/" + id);
    const x = d.row, a = x.attributes || {};
    const f = (k, v) => v === null || v === undefined || v === "" ? "" : `<dt>${k}</dt><dd>${v}</dd>`;
    el.innerHTML = `<button class="btn close">Close</button>
      <h2 style="margin-top:0">${esc(x.name)}</h2>
      <div>${x.recommended ? '<span class="chip rec">recommended</span>' : ""}<span class="chip">${esc(x.category)}</span>${x.subcategory ? `<span class="chip">${esc(x.subcategory)}</span>` : ""}<span class="chip">${esc(x.status)}</span></div>
      <dl>
        ${f("Address", esc([x.address, x.postcode].filter(Boolean).join(", ")))}
        ${f("Area", esc([x.area, x.borough].filter(Boolean).join(", ")))}
        ${f("Website", link(x.website))}${f("Phone", esc(x.phone))}${f("Price", esc(x.price_band))}
        ${f("Slug", esc(x.slug))}${f("Map", x.lat ? link(`https://www.google.com/maps/search/?api=1&query=${x.lat},${x.lng}`, "Google Maps") : "")}
        ${f("Hygiene rating", a.fsa ? esc(`${a.fsa.hygieneRating}${a.fsa.ratingDate ? ", inspected " + day(a.fsa.ratingDate) : ""}`) : "")}
        ${f("Came from", esc(x.origin))}${f("First seen", day(x.first_seen))}${f("Last checked", day(x.last_checked))}${f("Updated", day(x.updated_at))}
      </dl>
      <h2>Appears in our articles (${(d.appears || []).length})</h2>
      ${(d.appears || []).length ? `<table><tr><th>Article</th><th>How</th></tr>${d.appears.map((r) => `<tr>
        <td><a href="#" data-article="${esc(r.article_slug)}">${esc(r.title)}</a>${r.draft ? ' <span class="chip">draft</span>' : ""}${r.heading ? `<div class="small muted">${esc(r.heading)}</div>` : ""}</td>
        <td class="small">${r.kind === "entry" ? '<span class="chip rec">entry</span>' : '<span class="chip">mention</span>'}${safeUrl(r.url) ? ` ${link(r.url, "on the site")}` : ""}</td></tr>`).join("")}</table>` : '<p class="muted">Not in any article.</p>'}
      <h2>Mentions by sources (${d.reviews.length})</h2>
      ${d.reviews.length ? `<table><tr><th>Source</th><th>Title</th><th>Date</th></tr>${d.reviews.map((r) => `<tr><td>${esc(r.source || "")}${r.tier ? ` <span class="chip">${esc(r.tier)}</span>` : ""}${r.paid ? ' <span class="chip">paid</span>' : ""}</td><td>${link(r.url, r.title || r.topic || r.url || "")}${r.quote ? `<div class="small muted">“${esc(r.quote)}”</div>` : ""}</td><td class="small">${day(r.published_on)}</td></tr>`).join("")}</table>` : '<p class="muted">None.</p>'}
      ${d.deals.length ? `<h2>Deals</h2><table><tr><th>Offer</th><th>When</th></tr>${d.deals.map((r) => `<tr><td>${link(r.source_url, r.offer || r.type)}${r.price ? ` <span class="chip">${esc(r.price)}</span>` : ""}</td><td class="small">${esc([r.days, r.times].filter(Boolean).join(", "))}${r.ends_on ? `<div class="muted">until ${day(r.ends_on)}</div>` : ""}</td></tr>`).join("")}</table>` : ""}
      ${d.events.length ? `<h2>Upcoming events</h2><table><tr><th>Event</th><th>Date</th></tr>${d.events.map((r) => `<tr><td>${link(r.url, r.name)}</td><td class="small">${day(r.starts_on)}</td></tr>`).join("")}</table>` : ""}
      ${d.branches.length ? `<h2>Branches</h2><p>${d.branches.map((b) => `<a href="#" data-id="${b.id}">${esc(b.name)}</a> <span class="muted small">${esc(b.postcode)}</span>`).join("<br>")}</p>` : ""}
      ${d.duplicates.length ? `<h2>Matched register rows</h2><p class="small">${d.duplicates.map((b) => `${esc(b.name)} <span class="muted">${esc(b.postcode)} · ${esc(b.origin)}${b.match ? " · " + esc(b.match.confidence) : ""}</span>`).join("<br>")}</p>` : ""}
      <h2>Everything else we hold</h2><pre>${esc(JSON.stringify(a, null, 2))}</pre>`;
    el.querySelector(".close").onclick = () => el.classList.remove("open");
    el.querySelectorAll("a[data-id]").forEach((l) => l.onclick = (ev) => { ev.preventDefault(); openPlace(l.dataset.id); });
    el.querySelectorAll("a[data-article]").forEach((l) => l.onclick = (ev) => { ev.preventDefault(); openArticle(l.dataset.article); });
  } catch (e) { el.innerHTML = `<button class="btn close">Close</button><div class="err">${esc(e.message)}</div>`; el.querySelector(".close").onclick = () => el.classList.remove("open"); }
}
document.addEventListener("keydown", (e) => { if (e.key === "Escape") $("#panel").classList.remove("open"); });

// Deals
let dOpts = false;
["dwhen", "dtype", "dcat", "dbor"].forEach((id) => $("#" + id).addEventListener("change", loadDeals));
$("#dq").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(loadDeals, 300); });
$("#dreset").onclick = () => { ["dq", "dtype", "dcat", "dbor"].forEach((id) => $("#" + id).value = ""); $("#dwhen").value = "current"; loadDeals(); };
const nice = (t) => String(t || "").replace(/-/g, " ");
const today = () => new Date().toISOString().slice(0, 10);
async function loadDeals() {
  if (!dOpts) {
    try {
      const o = await api("/api/deal-options");
      $("#dtype").innerHTML = `<option value="">Any kind of deal</option>` + o.types.map((t) => `<option value="${esc(t.type)}">${esc(nice(t.type))} (${fmt(t.n)})</option>`).join("");
      $("#dcat").innerHTML = `<option value="">Any type of place</option>` + o.categories.map((t) => `<option value="${esc(t.category)}">${esc(t.category)} (${fmt(t.n)})</option>`).join("");
      $("#dbor").innerHTML = `<option value="">Any borough</option>` + o.boroughs.map((t) => `<option value="${esc(t.borough)}">${esc(t.borough)} (${fmt(t.n)})</option>`).join("");
      dOpts = true;
    } catch {}
  }
  const p = new URLSearchParams({ q:$("#dq").value.trim(), when:$("#dwhen").value, type:$("#dtype").value, category:$("#dcat").value, borough:$("#dbor").value });
  const el = $("#dlist");
  try {
    const r = await api("/api/deals?" + p);
    el.innerHTML = `<div class="pager"><span>${fmt(r.total)} deals${r.total > r.rows.length ? `, showing the first ${fmt(r.rows.length)}` : ""}</span>
        ${r.news ? `<span class="muted">·</span><a href="#" id="dnews">${fmt(r.news)} deal stories in the content queue are waiting</a>` : ""}</div>
      <table><tr><th>Place</th><th>Deal</th><th>Price</th><th>When</th><th>Checked</th><th>Details</th></tr>
      ${r.rows.map((x) => `<tr>
        <td>${x.place_id ? `<a href="#" data-place="${x.place_id}">${esc(x.place_name)}</a>` : esc(x.place_name)}${x.recommended ? ' <span class="chip rec">recommended</span>' : ""}
          <div class="small muted">${esc([x.category, x.area || x.borough].filter(Boolean).join(" · "))}</div>${x.branches ? `<div class="small muted">${esc(x.branches)}</div>` : ""}</td>
        <td><span class="chip">${esc(nice(x.type))}</span><div>${link(x.source_url, x.offer || "Offer")}</div></td>
        <td class="small">${esc(x.price)}</td>
        <td class="small">${esc([x.days, x.times].filter(Boolean).join(", "))}${x.starts_on ? `<div class="muted">from ${day(x.starts_on)}</div>` : ""}${x.ends_on ? `<div class="${x.ends_on < today() ? "stale" : "muted"}">until ${day(x.ends_on)}</div>` : ""}</td>
        <td class="small">${day(x.last_checked)}</td>
        <td class="small muted">${esc(x.conditions)}</td></tr>`).join("") || `<tr><td colspan="6" class="muted">No deals match.</td></tr>`}
      </table>`;
    el.querySelectorAll("a[data-place]").forEach((l) => l.onclick = (ev) => { ev.preventDefault(); openPlace(l.dataset.place); });
    const news = $("#dnews");
    if (news) news.onclick = (ev) => { ev.preventDefault(); $("#qstat").value = "new"; $("#qtag").value = "deal"; qPage = 0; show("queue"); };
  } catch (e) { el.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

// Sources
const WATCH = { watched:"Watched", no_feed:"No feed to watch", not_watched:"Not watched", dead:"Gone", excluded:"Excluded" };
const KINDS = { youtube:"YouTube", tiktok:"TikTok", blog:"Blog", publication:"Publication", instagram:"Instagram" };
["skind", "stier", "swatch", "ssort"].forEach((id) => $("#" + id).addEventListener("change", loadSources));
$("#sq").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(loadSources, 300); });
function sourceLinks(x) {
  const out = [];
  for (const [k, u] of Object.entries(x.platforms || {})) out.push(link(u, KINDS[k] || k));
  if (x.url) out.push(link(x.url, x.domain || "Website"));
  else if (x.domain) out.push(link("https://" + x.domain, x.domain));
  return out.join(" · ");
}
async function loadSources() {
  const p = new URLSearchParams({ q:$("#sq").value.trim(), kind:$("#skind").value, tier:$("#stier").value, watch:$("#swatch").value, sort:$("#ssort").value });
  const el = $("#slist");
  try {
    const r = await api("/api/sources?" + p);
    el.innerHTML = `<div class="pager"><span>${fmt(r.total)} sources</span></div>
      <table><tr><th>Source</th><th>Kind</th><th>Tier</th><th>Links</th><th class="num">Reviews</th><th>Watching</th><th>Newest item found</th><th>Last checked</th></tr>
      ${r.rows.map((x) => `<tr class="click" data-id="${x.id}">
        <td>${esc(x.name)}${x.note ? `<div class="small muted">${esc(x.note.length > 140 ? x.note.slice(0, 140) + "…" : x.note)}</div>` : ""}</td>
        <td>${esc(KINDS[x.kind] || x.kind)}</td><td>${esc(x.tier || "")}</td>
        <td class="small">${sourceLinks(x)}</td>
        <td class="num">${fmt(x.reviews)}</td>
        <td class="small ${x.watch === "dead" ? "stale" : ""}">${esc(WATCH[x.watch])}${x.watch === "dead" && x.youtube_missing ? `<div class="muted">channel not found ${day(x.youtube_missing)}</div>` : ""}</td>
        <td class="small">${day(x.latest)}${x.queued ? `<div class="muted">${fmt(x.queued)} in queue</div>` : ""}</td>
        <td class="small">${day(x.last_checked)}</td></tr>`).join("") || `<tr><td colspan="8" class="muted">No sources match.</td></tr>`}
      </table>`;
    el.querySelectorAll("tr[data-id]").forEach((tr) => tr.onclick = (ev) => { if (ev.target.tagName !== "A") openSource(tr.dataset.id); });
  } catch (e) { el.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
async function openSource(id) {
  const el = $("#panel");
  el.innerHTML = "Loading…"; el.classList.add("open");
  try {
    const d = await api("/api/sources/" + id);
    const x = d.row;
    el.innerHTML = `<button class="btn close">Close</button>
      <h2 style="margin-top:0">${esc(x.name)}</h2>
      <div><span class="chip">${esc(KINDS[x.kind] || x.kind)}</span>${x.tier ? `<span class="chip">tier ${esc(x.tier)}</span>` : ""}<span class="chip">${esc(WATCH[x.watch])}</span></div>
      <p>${sourceLinks(x)}</p>
      ${(x.topics || []).length ? `<p class="small">Topics: ${x.topics.map((t) => `<span class="chip">${esc(t)}</span>`).join("")}</p>` : ""}
      ${x.notes || x.attributes?.note ? `<p class="small muted">${esc(x.notes || x.attributes.note)}</p>` : ""}
      <h2>Reviews and mentions (${fmt(d.reviews.length)})</h2>
      ${d.reviews.length ? `<table><tr><th>Place</th><th>Article or video</th><th>Date</th></tr>${d.reviews.map((r) => `<tr>
        <td>${r.place_id ? `<a href="#" data-place="${r.place_id}">${esc(r.place_name)}</a>` : esc(r.place_name)}${r.paid ? ' <span class="chip">paid</span>' : ""}</td>
        <td>${link(r.url, r.title || r.topic || r.url || "")}${r.quote ? `<div class="small muted">“${esc(r.quote)}”</div>` : ""}</td>
        <td class="small">${day(r.published_on)}</td></tr>`).join("")}</table>` : '<p class="muted">None recorded.</p>'}
      ${d.queued.length ? `<h2>Latest in the content queue</h2><table>${d.queued.map((c) => `<tr><td>${link(c.url, c.title || c.url)}</td><td class="small">${esc(c.medium)}</td><td class="small">${day(c.published_on)}</td><td class="small muted">${{ new:"waiting", added:"worth covering", rejected:"dismissed" }[c.status] || esc(c.status)}</td></tr>`).join("")}</table>` : ""}`;
    el.querySelector(".close").onclick = () => el.classList.remove("open");
    el.querySelectorAll("a[data-place]").forEach((l) => l.onclick = (ev) => { ev.preventDefault(); openPlace(l.dataset.place); });
  } catch (e) { el.innerHTML = `<button class="btn close">Close</button><div class="err">${esc(e.message)}</div>`; el.querySelector(".close").onclick = () => el.classList.remove("open"); }
}

// Articles
let aCats = false;
["acat", "adraft", "asort"].forEach((id) => $("#" + id).addEventListener("change", loadArticles));
$("#aq").addEventListener("input", () => { clearTimeout(timer); timer = setTimeout(loadArticles, 300); });
async function loadArticles() {
  const p = new URLSearchParams({ q:$("#aq").value.trim(), category:$("#acat").value, draft:$("#adraft").value, sort:$("#asort").value });
  const el = $("#alist");
  try {
    const r = await api("/api/articles?" + p);
    if (!aCats && r.categories.length) {
      $("#acat").innerHTML = `<option value="">Any section</option>` + r.categories.map((c) => `<option value="${esc(c.category)}">${esc(c.category)} (${fmt(c.n)})</option>`).join("");
      aCats = true;
    }
    if (r.missing || (!r.total && !p.get("q") && !p.get("category") && !p.get("draft"))) {
      el.innerHTML = `<p class="muted">The articles are still being loaded into the database. Check back in a few minutes.</p>`;
      return;
    }
    el.innerHTML = `<div class="pager"><span>${fmt(r.total)} articles</span></div>
      <table><tr><th>Article</th><th>Section</th><th class="num">Entries</th><th class="num">Mentions</th><th>Updated</th></tr>
      ${r.rows.map((x) => `<tr class="click" data-slug="${esc(x.slug)}">
        <td>${esc(x.title)}${x.draft ? ' <span class="chip">draft</span>' : ""}${safeUrl(x.url) ? `<div class="small">${link(x.url, "on the site")}</div>` : ""}</td>
        <td class="small">${esc(x.category || "")}</td><td class="num">${fmt(x.entries)}</td><td class="num">${fmt(x.mentions)}</td>
        <td class="small">${day(x.updated_at || x.published_at)}</td></tr>`).join("") || `<tr><td colspan="5" class="muted">No articles match.</td></tr>`}
      </table>`;
    el.querySelectorAll("tr[data-slug]").forEach((tr) => tr.onclick = (ev) => { if (ev.target.tagName !== "A") openArticle(tr.dataset.slug); });
  } catch (e) { el.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}
async function openArticle(slug) {
  const el = $("#panel");
  el.innerHTML = "Loading…"; el.classList.add("open");
  try {
    const d = await api("/api/articles/" + encodeURIComponent(slug));
    const x = d.row;
    const group = (kind, label) => {
      const rows = d.places.filter((r) => r.kind === kind);
      return `<h2>${label} (${fmt(rows.length)})</h2>` + (rows.length ? `<table>${rows.map((r) => `<tr>
        <td><a href="#" data-place="${r.id}">${esc(r.name)}</a>${r.recommended ? ' <span class="chip rec">recommended</span>' : ""}${r.status !== "open" ? ` <span class="chip">${esc(r.status)}</span>` : ""}
        ${kind === "entry" && r.heading && r.heading !== r.name ? `<div class="small muted">${esc(r.heading)}</div>` : ""}</td>
        <td class="small muted">${esc([r.category, r.area || r.borough].filter(Boolean).join(" · "))}</td></tr>`).join("")}</table>` : '<p class="muted">None.</p>');
    };
    el.innerHTML = `<button class="btn close">Close</button>
      <h2 style="margin-top:0">${esc(x.title)}</h2>
      <div>${x.category ? `<span class="chip">${esc(x.category)}</span>` : ""}${x.draft ? '<span class="chip">draft</span>' : ""}${(x.tags || []).map((t) => `<span class="chip">${esc(t)}</span>`).join("")}</div>
      <dl>${safeUrl(x.url) ? `<dt>On the site</dt><dd>${link(x.url)}</dd>` : ""}${x.published_at ? `<dt>Published</dt><dd>${day(x.published_at)}</dd>` : ""}${x.updated_at ? `<dt>Updated</dt><dd>${day(x.updated_at)}</dd>` : ""}</dl>
      ${group("entry", "Places with their own entry")}
      ${group("mention", "Places mentioned in the text")}`;
    el.querySelector(".close").onclick = () => el.classList.remove("open");
    el.querySelectorAll("a[data-place]").forEach((l) => l.onclick = (ev) => { ev.preventDefault(); openPlace(l.dataset.place); });
  } catch (e) { el.innerHTML = `<button class="btn close">Close</button><div class="err">${esc(e.message)}</div>`; el.querySelector(".close").onclick = () => el.classList.remove("open"); }
}

// Content queue
let qPage = 0;
["qstat", "qtag", "qmed", "qplaces", "qall"].forEach((id) => $("#" + id).addEventListener("change", () => { qPage = 0; loadQueue(); }));
$("#qq").addEventListener("input", () => { qPage = 0; clearTimeout(timer); timer = setTimeout(loadQueue, 300); });
async function loadQueue() {
  const p = new URLSearchParams({ status:$("#qstat").value, tag:$("#qtag").value, medium:$("#qmed").value, q:$("#qq").value.trim(),
    places:$("#qplaces").checked ? "1" : "", all:$("#qall").checked ? "1" : "", page:qPage });
  const el = $("#qlist");
  try {
    const r = await api("/api/queue?" + p);
    el.innerHTML = `<div class="pager"><span>${fmt(r.total)} items</span>${pager(r.total, 50, r.page)}</div>` +
      (r.rows.map((x) => `<div class="item" data-id="${x.id}"><div class="body">
        <h3>${link(x.url, x.title || x.url)}</h3>
        <div class="small muted">${esc(x.creator || "")} · ${esc(x.medium)} on ${esc(x.platform)}${x.published_on ? " · " + day(x.published_on) : ""}</div>
        <div>${(x.tags || []).map((t) => `<span class="chip">${esc(t)}</span>`).join("")}${x.sponsored ? `<span class="chip" title="${esc((x.sponsor_signals || []).join(", "))}">sponsored?</span>` : ""}${x.is_london ? "" : '<span class="chip">not London</span>'}</div>
        ${(x.places_mentioned || []).length ? `<div class="small" style="margin-top:4px">Places: ${x.places_mentioned.map((m) => `<a href="#" data-place="${esc(m.id)}">${esc(m.name)}</a>${m.recommended ? " ★" : ""}`).join(", ")}</div>` : ""}
        ${x.description ? `<p>${esc(x.description)}</p>` : ""}
      </div><div class="acts">
        ${x.status !== "added" ? `<button class="btn add" data-set="added">Worth covering</button>` : ""}
        ${x.status !== "rejected" ? `<button class="btn dismiss" data-set="rejected">Dismiss</button>` : ""}
        ${x.status !== "new" ? `<button class="btn" data-set="new">Back to waiting</button>` : ""}
      </div></div>`).join("") || '<p class="muted">Nothing here.</p>') +
      `<div class="pager">${pager(r.total, 50, r.page)}</div>`;
    el.querySelectorAll("[data-page]").forEach((b) => b.onclick = () => { qPage = Number(b.dataset.page); loadQueue(); scrollTo(0, 0); });
    el.querySelectorAll("a[data-place]").forEach((l) => l.onclick = (ev) => { ev.preventDefault(); openPlace(l.dataset.place); });
    el.querySelectorAll("[data-set]").forEach((b) => b.onclick = async () => {
      const item = b.closest(".item");
      item.querySelectorAll("button").forEach((x) => x.disabled = true);
      try {
        await api("/api/queue/" + item.dataset.id, { method:"POST", headers:{ "content-type":"application/json" }, body:JSON.stringify({ status:b.dataset.set }) });
        item.classList.add("done");
        item.querySelector(".acts").innerHTML = `<span class="small">${{ added:"Marked worth covering", rejected:"Dismissed", new:"Back to waiting" }[b.dataset.set]}</span>`;
      } catch (e) { alert("Could not save: " + e.message); item.querySelectorAll("button").forEach((x) => x.disabled = false); }
    });
  } catch (e) { el.innerHTML = `<div class="err">${esc(e.message)}</div>`; }
}

let start = "dash";
try { start = localStorage.getItem("tab") || "dash"; } catch {}
show(TABS.includes(start) ? start : "dash");
</script>
</body>
</html>
